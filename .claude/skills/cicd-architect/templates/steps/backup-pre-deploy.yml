# =============================================================================
# steps/backup-pre-deploy.yml
# R15 capa 1: backup del wwwroot ANTES de desplegar. Solo PRE/PROD (NUNCA DEV).
# Guarda en $(backupRoot)\<app>\backup-<BuildId> + metadata. R13: Out-File -Encoding UTF8.
# Requiere las variables del pipeline:
#   $(iisVirtualApp)   - nombre de la vApp (para la ruta del backup)
#   $(iisPhysicalPath) - ruta fisica REAL del sitio/vApp en disco. Si esta vacia,
#                        se asume C:\inetpub\wwwroot\<vApp>. NECESARIO cuando la vApp
#                        no cuelga directamente de wwwroot (ej. EWP: C:\inetpub\wwwroot\MiApp.api\miapp).
#   $(backupRoot)      - raiz de backups (default C:\Backups; override si el server no tiene unidad D:).
# =============================================================================
steps:
  - task: PowerShell@2
    displayName: 'Backup pre-deploy (R15 capa 1)'
    inputs:
      targetType: inline
      script: |
        $app        = "$(iisVirtualApp)"
        $src        = "$(iisPhysicalPath)"
        if ([string]::IsNullOrWhiteSpace($src)) { $src = "C:\inetpub\wwwroot\$app" }
        $backupPath = "$(backupRoot)\$app\backup-$(Build.BuildId)"
        if (Test-Path $src) {
          New-Item -ItemType Directory -Force -Path $backupPath | Out-Null
          Copy-Item -Path $src -Destination $backupPath -Recurse -Force
          "$(Build.BuildId)|$(Build.BuildNumber)|$((Get-Date).ToString('s'))" | Out-File (Join-Path $backupPath '_backup-metadata.txt') -Encoding UTF8
          Write-Host "Backup creado en: $backupPath"
        } else {
          Write-Warning "No existe $src todavia (primer deploy?). Sin backup; el deploy continua."
        }
